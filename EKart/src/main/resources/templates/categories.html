<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>EKart — Categories</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/pages/home.css}" />
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<section class="st-section">
    <div class="st-section-head">
        <div><h2>Shop by Category</h2></div>
    </div>
    <div class="st-cat-grid">
        <a th:each="c : ${categories}" th:href="@{/home(category=${c.name})}" class="st-cat-card">
            <div class="st-cat-icon"><i class="fas" th:classappend="${c.icon}"></i></div>
            <span th:text="${c.name}"></span>
        </a>
        <a th:href="@{/home}" class="st-cat-card"><div class="st-cat-icon"><i class="fas fa-border-all"></i></div><span>All</span></a>
        <p th:if="${#lists.isEmpty(categories)}">No categories yet.</p>
    </div>
</section>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: mobileMenuScript}"></div>
<div th:replace="~{fragments :: widgets}"></div>
</body>
</html>
