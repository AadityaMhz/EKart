<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Account — EKart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/pages/profile.css}" />
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<div class="st-breadcrumbs"><a th:href="@{/home}">Home</a><span>/</span>My Account</div>

<div class="st-dash-layout">
  <div class="st-dash-menu">
    <div class="prof-head" style="padding:6px 6px 16px;">
      <div class="prof-avatar"><img th:src="@{/image/sabal.jpg}" alt="Profile" /></div>
      <div><h2 th:text="${user.fullName != null and !user.fullName.isEmpty() ? user.fullName : user.username}"></h2><span th:text="${user.email}"></span></div>
    </div>
    <button class="active" data-tab="info" onclick="switchDash('info', this)"><i class="fas fa-user"></i> Profile Info</button>
    <button data-tab="orders" onclick="switchDash('orders', this)"><i class="fas fa-box"></i> My Orders</button>
    <button th:if="${user.role.name() == 'BUYER'}" onclick="window.location.href='/become-seller'"><i class="fas fa-shop"></i> Become a Seller</button>
    <button onclick="window.location.href='/logout'"><i class="fas fa-right-from-bracket"></i> Logout</button>
  </div>

  <div class="st-dash-panel">
    <div id="dash-info" class="st-tab-panel active">
      <h3 style="margin-top:0;">Profile Information</h3>
      <p style="color:green" th:if="${message}" th:text="${message}"></p>
      <form th:action="@{/profile/update}" method="post">
        <div class="form-group"><label for="fullName">Name</label><input type="text" id="fullName" name="fullName" th:value="${user.fullName}" /></div>
        <div class="form-group"><label>Username</label><input type="text" th:value="${user.username}" disabled /></div>
        <div class="form-group"><label>Email</label><input type="email" th:value="${user.email}" disabled /></div>
        <div class="form-group"><label for="phone">Phone</label><input type="tel" id="phone" name="phone" th:value="${user.phone}" /></div>
        <div class="form-group"><label for="address">Address</label><input type="text" id="address" name="address" th:value="${user.address}" /></div>
        <div class="form-actions">
          <button type="submit" class="save-btn" style="padding:10px 20px;border-radius:999px !important;">Save</button>
        </div>
      </form>
    </div>

    <div id="dash-orders" class="st-tab-panel">
      <h3 style="margin-top:0;">My Orders</h3>
      <div class="order-row" th:each="o : ${orders}">
        <span th:text="'#ORD' + ${o.id} + ' — ' + ${#lists.size(o.items)} + ' item(s) — Rs. ' + ${#numbers.formatDecimal(o.totalAmount,0,'COMMA',0,'POINT')}"></span>
        <span class="order-status" th:text="${o.status}"></span>
      </div>
      <p th:if="${#lists.isEmpty(orders)}" style="color:var(--muted);">You haven't placed any orders yet.</p>
    </div>
  </div>
</div>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: mobileMenuScript}"></div>
<div th:replace="~{fragments :: widgets}"></div>
<script>
  function switchDash(tab, btn) {
    document.querySelectorAll('.st-dash-menu button[data-tab]').forEach(function (b) { b.classList.remove('active'); });
    document.querySelectorAll('.st-dash-panel .st-tab-panel').forEach(function (p) { p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('dash-' + tab).classList.add('active');
  }
</script>
</body>
</html>
