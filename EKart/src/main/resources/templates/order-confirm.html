<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Confirmed — EKart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/pages/order-confirm.css}" />
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<div class="oc-wrap">
  <div class="oc-check"><i class="fas fa-check"></i></div>
  <h1>Thank You for Your Order!</h1>
  <p style="color:var(--muted);">Your order has been placed successfully.</p>

  <div class="oc-summary">
    <h3>Order Summary</h3>
    <p><span>Order ID</span><span th:text="'ORD' + ${order.id}"></span></p>
    <p><span>Order Date</span><span th:text="${#temporals.format(order.orderDate, 'MMMM d, yyyy')}"></span></p>
    <p><span>Shipping To</span><span th:text="${order.shippingAddress}"></span></p>
    <p>
      <span>Payment Method</span>
      <span th:text="${order.paymentMethod}"></span>
    </p>
    <p><span>Status</span><span th:text="${order.status}"></span></p>
    <p th:if="${order.couponCode != null}"><span>Coupon Applied</span><span th:text="${order.couponCode} + ' (− Rs. ' + ${#numbers.formatDecimal(order.discountAmount,0,'COMMA',0,'POINT')} + ')'"></span></p>
    <h3 style="margin-top:16px;">Items</h3>
    <ul class="oc-items">
      <li th:each="item : ${order.items}"
          th:text="${item.quantity} + 'x ' + ${item.product.name} + ' — Rs. ' + ${#numbers.formatDecimal(item.priceAtPurchase * item.quantity,0,'COMMA',0,'POINT')}"></li>
    </ul>
    <p class="oc-total"><span>Total Paid</span><span th:text="'Rs. ' + ${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT')}"></span></p>
  </div>

  <a th:href="@{/home}" class="add-cart-btn" style="text-decoration:none;display:inline-block;padding:12px 28px;border-radius:999px;margin-top:26px;">Continue Shopping</a>
</div>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: mobileMenuScript}"></div>
<div th:replace="~{fragments :: widgets}"></div>
</body>
</html>
